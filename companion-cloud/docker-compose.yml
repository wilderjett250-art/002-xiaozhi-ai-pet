services:
  pet-cloud:
    build: .
    container_name: pet-companion-cloud
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PET_CLOUD_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - pet-cloud-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pet-cloud-data:
    name: pet-companion-cloud-data
